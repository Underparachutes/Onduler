<?xml version="1.0" encoding="UTF-8"?>
<!--
  Onduler Instagram carousel — slide 3 (2026-05-25)
  1080 × 1350 px portrait (IG feed-post optimal 4:5).

  Mockup of the Motions page (daily checklist surface) in the dark theme.
  Visual continuity with slide 1 (deep ocean) — carousel reads:
    slide 1 dark wake → slide 2 cream personal note → slide 3 dark app preview

  THIS IS A STYLIZED MOCKUP, not a literal screenshot. If you have a real
  Motions-page screenshot, swap it in by replacing this whole SVG with a
  PNG/JPG at the same dimensions.

  EXPORT
  - Open in Figma / Affinity / Illustrator.
  - Export as PNG at 1080 × 1350 (no scaling).
  - Convert text to outlines on export if your tool doesn't have Manrope /
    IBM Plex Mono.

  POSTING (carousel)
  - Slide 1: instagram-post-tester.svg (wake hero + CTA)
  - Slide 2: instagram-post-2-tester.svg (personal note)
  - Slide 3: this file (what you'll actually be using)
  - Caption + first comment from HANDOFF.md apply to the whole carousel.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1080 1350"
     width="1080"
     height="1350"
     preserveAspectRatio="xMidYMid meet">
  <title>Onduler IG carousel slide 3 — app preview</title>
  <desc>Mockup of the Motions page in dark mode. Date header, daily progress bar, paper-list motion checklist, bottom nav. Stylized representation of the actual app surface.</desc>

  <defs>
    <linearGradient id="progress-gradient" gradientUnits="userSpaceOnUse"
                    x1="0" y1="0" x2="900" y2="0">
      <stop offset="0"   stop-color="#F67E4E" stop-opacity="0.40"/>
      <stop offset="1"   stop-color="#F67E4E" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <g id="BACKGROUND">
    <rect width="1080" height="1350" fill="#0b2330"/>
  </g>

  <!-- Small "in the app" kicker above the mockup so viewers know what they're looking at -->
  <g id="KICKER">
    <text x="540" y="76"
          text-anchor="middle"
          font-family="Manrope, ui-sans-serif, system-ui, sans-serif"
          font-size="20"
          font-weight="500"
          letter-spacing="0.30em"
          fill="#ede4cc"
          opacity="0.55">IN THE APP</text>
  </g>

  <!-- Page date header -->
  <g id="DATE">
    <text x="80" y="180"
          font-family="Manrope, ui-sans-serif, system-ui, sans-serif"
          font-size="34"
          font-weight="500"
          letter-spacing="0.012em"
          fill="#ede4cc"
          opacity="0.92">Tuesday, May 26</text>
  </g>

  <!-- Daily progress -->
  <g id="PROGRESS">
    <text x="80" y="252"
          font-family="IBM Plex Mono, ui-monospace, monospace"
          font-size="22"
          fill="#ede4cc"
          opacity="0.60">today</text>
    <text x="80" y="320"
          font-family="Manrope, ui-sans-serif, system-ui, sans-serif"
          font-size="58"
          font-weight="500"
          letter-spacing="0.01em"
          fill="#ede4cc">13</text>
    <text x="158" y="320"
          font-family="Manrope, ui-sans-serif, system-ui, sans-serif"
          font-size="58"
          font-weight="500"
          letter-spacing="0.01em"
          fill="#ede4cc"
          opacity="0.45">/ 15 pts</text>

    <!-- Progress bar background -->
    <rect x="80" y="350" width="920" height="14" rx="7" fill="#ede4cc" opacity="0.10"/>
    <!-- Filled portion (13/15 ≈ 86.7%) -->
    <rect x="80" y="350" width="797" height="14" rx="7" fill="url(#progress-gradient)"/>
  </g>

  <!-- Motion rows -->
  <g id="MOTIONS" font-family="Manrope, ui-sans-serif, system-ui, sans-serif">
    <!-- Row template: checkbox at x=80, name centered-left at x=160, points right-aligned at x=1000 -->
    <!-- Checked rows: filled cream checkbox, line-through name, 0.45 opacity -->
    <!-- Unchecked rows: outline checkbox, normal text -->

    <!-- Row 1: Meditate ✓ -->
    <g transform="translate(0 440)">
      <rect x="80" y="0" width="44" height="44" rx="6" fill="#ede4cc" opacity="0.95"/>
      <path d="M 91,22 L 100,32 L 113,15" stroke="#0b2330" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="160" y="34" font-size="30" font-weight="400" fill="#ede4cc" opacity="0.50" text-decoration="line-through">Meditate</text>
      <text x="1000" y="34" text-anchor="end" font-size="26" font-family="IBM Plex Mono, monospace" fill="#ede4cc" opacity="0.40">3 pts</text>
      <line x1="80" y1="68" x2="1000" y2="68" stroke="#ede4cc" stroke-width="0.5" opacity="0.10"/>
    </g>

    <!-- Row 2: Walk outside ✓ -->
    <g transform="translate(0 528)">
      <rect x="80" y="0" width="44" height="44" rx="6" fill="#ede4cc" opacity="0.95"/>
      <path d="M 91,22 L 100,32 L 113,15" stroke="#0b2330" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="160" y="34" font-size="30" font-weight="400" fill="#ede4cc" opacity="0.50" text-decoration="line-through">Walk outside</text>
      <text x="1000" y="34" text-anchor="end" font-size="26" font-family="IBM Plex Mono, monospace" fill="#ede4cc" opacity="0.40">2 pts</text>
      <line x1="80" y1="68" x2="1000" y2="68" stroke="#ede4cc" stroke-width="0.5" opacity="0.10"/>
    </g>

    <!-- Row 3: Cook dinner ✓ -->
    <g transform="translate(0 616)">
      <rect x="80" y="0" width="44" height="44" rx="6" fill="#ede4cc" opacity="0.95"/>
      <path d="M 91,22 L 100,32 L 113,15" stroke="#0b2330" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="160" y="34" font-size="30" font-weight="400" fill="#ede4cc" opacity="0.50" text-decoration="line-through">Cook dinner</text>
      <text x="1000" y="34" text-anchor="end" font-size="26" font-family="IBM Plex Mono, monospace" fill="#ede4cc" opacity="0.40">4 pts</text>
      <line x1="80" y1="68" x2="1000" y2="68" stroke="#ede4cc" stroke-width="0.5" opacity="0.10"/>
    </g>

    <!-- Row 4: Read ✓ -->
    <g transform="translate(0 704)">
      <rect x="80" y="0" width="44" height="44" rx="6" fill="#ede4cc" opacity="0.95"/>
      <path d="M 91,22 L 100,32 L 113,15" stroke="#0b2330" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="160" y="34" font-size="30" font-weight="400" fill="#ede4cc" opacity="0.50" text-decoration="line-through">Read</text>
      <text x="1000" y="34" text-anchor="end" font-size="26" font-family="IBM Plex Mono, monospace" fill="#ede4cc" opacity="0.40">3 pts</text>
      <line x1="80" y1="68" x2="1000" y2="68" stroke="#ede4cc" stroke-width="0.5" opacity="0.10"/>
    </g>

    <!-- Row 5: Stretch ✓ -->
    <g transform="translate(0 792)">
      <rect x="80" y="0" width="44" height="44" rx="6" fill="#ede4cc" opacity="0.95"/>
      <path d="M 91,22 L 100,32 L 113,15" stroke="#0b2330" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="160" y="34" font-size="30" font-weight="400" fill="#ede4cc" opacity="0.50" text-decoration="line-through">Stretch</text>
      <text x="1000" y="34" text-anchor="end" font-size="26" font-family="IBM Plex Mono, monospace" fill="#ede4cc" opacity="0.40">1 pt</text>
      <line x1="80" y1="68" x2="1000" y2="68" stroke="#ede4cc" stroke-width="0.5" opacity="0.10"/>
    </g>

    <!-- Row 6: Journal — unchecked -->
    <g transform="translate(0 880)">
      <rect x="80" y="0" width="44" height="44" rx="6" fill="none" stroke="#ede4cc" stroke-width="2" opacity="0.55"/>
      <text x="160" y="34" font-size="30" font-weight="400" fill="#ede4cc" opacity="0.92">Journal</text>
      <text x="1000" y="34" text-anchor="end" font-size="26" font-family="IBM Plex Mono, monospace" fill="#ede4cc" opacity="0.78">2 pts</text>
      <line x1="80" y1="68" x2="1000" y2="68" stroke="#ede4cc" stroke-width="0.5" opacity="0.10"/>
    </g>

    <!-- Row 7: Call a friend — unchecked -->
    <g transform="translate(0 968)">
      <rect x="80" y="0" width="44" height="44" rx="6" fill="none" stroke="#ede4cc" stroke-width="2" opacity="0.55"/>
      <text x="160" y="34" font-size="30" font-weight="400" fill="#ede4cc" opacity="0.92">Call a friend</text>
      <text x="1000" y="34" text-anchor="end" font-size="26" font-family="IBM Plex Mono, monospace" fill="#ede4cc" opacity="0.78">4 pts</text>
      <line x1="80" y1="68" x2="1000" y2="68" stroke="#ede4cc" stroke-width="0.5" opacity="0.10"/>
    </g>

    <!-- Row 8: Water plants — unchecked -->
    <g transform="translate(0 1056)">
      <rect x="80" y="0" width="44" height="44" rx="6" fill="none" stroke="#ede4cc" stroke-width="2" opacity="0.55"/>
      <text x="160" y="34" font-size="30" font-weight="400" fill="#ede4cc" opacity="0.92">Water plants</text>
      <text x="1000" y="34" text-anchor="end" font-size="26" font-family="IBM Plex Mono, monospace" fill="#ede4cc" opacity="0.78">1 pt</text>
    </g>
  </g>

  <!-- Bottom nav -->
  <g id="NAV">
    <line x1="0" y1="1180" x2="1080" y2="1180" stroke="#ede4cc" stroke-width="0.5" opacity="0.15"/>

    <!-- Motions (checkbox, active) -->
    <g transform="translate(135 1230)">
      <rect x="-20" y="-25" width="40" height="40" rx="6" fill="none" stroke="#ede4cc" stroke-width="2.5"/>
      <path d="M -13,-7 L -3,3 L 13,-13" stroke="#ede4cc" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="0" y="50" text-anchor="middle" font-family="Manrope, sans-serif" font-size="18" fill="#ede4cc" opacity="0.92">Motions</text>
    </g>

    <!-- Swells (compass) -->
    <g transform="translate(405 1230)">
      <circle cx="0" cy="-5" r="22" fill="none" stroke="#ede4cc" stroke-width="2" opacity="0.55"/>
      <path d="M -6,-15 L 0,4 L 6,-5 L 0,-15 Z" fill="#ede4cc" opacity="0.55"/>
      <text x="0" y="50" text-anchor="middle" font-family="Manrope, sans-serif" font-size="18" fill="#ede4cc" opacity="0.55">Swells</text>
    </g>

    <!-- Anchors (anchor) -->
    <g transform="translate(675 1230)">
      <circle cx="0" cy="-22" r="6" fill="none" stroke="#ede4cc" stroke-width="2" opacity="0.55"/>
      <line x1="0" y1="-16" x2="0" y2="14" stroke="#ede4cc" stroke-width="2" opacity="0.55"/>
      <line x1="-12" y1="-8" x2="12" y2="-8" stroke="#ede4cc" stroke-width="2" opacity="0.55"/>
      <path d="M -16,4 Q -14,18 0,18 Q 14,18 16,4" stroke="#ede4cc" stroke-width="2" fill="none" opacity="0.55"/>
      <text x="0" y="50" text-anchor="middle" font-family="Manrope, sans-serif" font-size="18" fill="#ede4cc" opacity="0.55">Anchors</text>
    </g>

    <!-- Settings (sliders) -->
    <g transform="translate(945 1230)">
      <line x1="-18" y1="-15" x2="18" y2="-15" stroke="#ede4cc" stroke-width="2" opacity="0.55"/>
      <circle cx="-4" cy="-15" r="5" fill="#0b2330" stroke="#ede4cc" stroke-width="2" opacity="0.55"/>
      <line x1="-18" y1="-2" x2="18" y2="-2" stroke="#ede4cc" stroke-width="2" opacity="0.55"/>
      <circle cx="8" cy="-2" r="5" fill="#0b2330" stroke="#ede4cc" stroke-width="2" opacity="0.55"/>
      <line x1="-18" y1="11" x2="18" y2="11" stroke="#ede4cc" stroke-width="2" opacity="0.55"/>
      <circle cx="-8" cy="11" r="5" fill="#0b2330" stroke="#ede4cc" stroke-width="2" opacity="0.55"/>
      <text x="0" y="50" text-anchor="middle" font-family="Manrope, sans-serif" font-size="18" fill="#ede4cc" opacity="0.55">Settings</text>
    </g>
  </g>
</svg>
