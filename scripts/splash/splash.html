<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; }
  p { margin: 0; font-family: 'Manrope', sans-serif; font-weight: 300; letter-spacing: 0.025em; }
</style>
</head>
<body>
<p>onduler</p>
<script>
  const q = new URLSearchParams(location.search)
  document.body.style.background = q.get('bg')
  const p = document.querySelector('p')
  p.style.color = q.get('fg')
  p.style.fontSize = q.get('px') + 'px'
</script>
</body>
</html>
